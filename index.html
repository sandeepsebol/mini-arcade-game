<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172b25" />
    <title>Monster Dash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div class="brand">Monster Dash</div>
        <div class="stats" aria-live="polite">
          <span>Time: <strong id="score">0.0s</strong></span>
          <span>Best: <strong id="best-score">0.0s</strong></span>
        </div>
      </header>

      <canvas id="gameCanvas" width="900" height="600" aria-label="Monster Dash game. Move the human and avoid the rocks and monster."></canvas>

      <div id="overlay" class="overlay visible">
        <div class="panel">
          <p class="eyebrow">A tiny game of keep-away</p>
          <h1>Monster Dash</h1>
          <p>Run from the monster and dodge the rocks.</p>
          <p>Touch a rock and the monster catches you!</p>
          <p class="hint">Move with WASD, arrow keys, or the buttons below.</p>
          <button id="startButton">Start running</button>
        </div>
      </div>

      <div class="controls" aria-label="Movement controls">
        <button class="control-button up" data-direction="up" aria-label="Move up">▲</button>
        <button class="control-button left" data-direction="left" aria-label="Move left">◀</button>
        <button class="control-button down" data-direction="down" aria-label="Move down">▼</button>
        <button class="control-button right" data-direction="right" aria-label="Move right">▶</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
